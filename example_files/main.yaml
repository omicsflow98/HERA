main:
  temp_dir: /Absolute/Path/to/directory  # Directory to store temporary files
  outdir: /Absolute/path/to/directory  # Output directory for the pipeline results
  apptainer: true  # Set to true if any of your processes require apptainer (singularity) containers

# Input files can either be a well-filtered VCF file, plink output files (bed/bim/fam), or the directory containing the hmmrohl files from ROHan.
inputfiles:
  filetype: vcf  # Set to either vcf, plink, or rohan
  file: /Absolute/Path/to/input/file # Path to the input file (.vcf file for VCF input, .bed/.bim/.fam file prefix for plink input, or the path to the directory containing the hmmrohl files outputted by ROHan)

# Only needed if running pipeline using SLURM cluster (i.e if you are using -profile slurm)
slurm:
  account: SLURM_account_name
  email: email_for_notifications

# Only needed if apptainer is set to true
# Containers should be specified and contain the required software for each process. If a process does not require any software, set to null
apptainer:
  path: /Absolute/path/to/apptainer/containers # Path to directory containing apptainer containers
  bedops: bedops.sif # requirements: bedops
  fixrohan: python3.sif # requirements: python with the following packages: argparse, yaml
  plink: plink.sif # requirements: plink
  detectruns: R.sif # requirements: detectRUNS
  splitplink: python3.sif # requirements: python with the following packages: csv, argparse, yaml
  overlap: python3.sif # requirements: python with the following packages: argparse, pyranges, pandas
  combineoverlap: null # requirements:NONE
  snpisland: gatk.sif # requirements: bedtools
  topsnp: python3.sif # requirements: python with the following packages: argparse, pandas, yaml
  splitROH: R.sif # requirements: R with the following packages: tidyverse, optparse, yaml
  fixROH: R.sif # requirements:  R with the following packages: tidyverse, optparse, yaml
  plots: null # requirements: NONE
  quarto: quarto.sif #requirements: quarto, R with the following packages: tidyverse, plotly, kableExtra, zoo, DT
  vcftools: vcftools.sif # requirements: vcftools
  versions: python3.sif # requirements: python with the following packages: argparse, yaml, defaultdict

#setting for bedops process
bedops:
  resources:
    slurm:
      memory: 4.GB
      time: "1h"
      cpus: 2
    local:
      memory: 2.GB
      time: "1h"
      cpus: 1

#setting for fixrohan process
fixrohan:
  resources:
    slurm:
      memory: 4.GB
      time: "1h"
      cpus: 2
    local:
      memory: 2.GB
      time: "1h"
      cpus: 1

#setting for quarto process
quarto:
  resources:
    slurm:
      memory: 16.GB
      time: "12h"
      cpus: 2
    local:
      memory: 2.GB
      time: "1h"
      cpus: 1

#setting for mergeversion process
version:
  resources:
    slurm:
      memory: 8.GB
      time: "2h"
      cpus: 2
    local:
      memory: 2.GB
      time: "1h"
      cpus: 1

#setting for vcftools process
vcftools:
  resources:
    slurm:
      memory: 16.GB
      time: "12h"
      cpus: 2
    local:
      memory: 2.GB
      time: "1h"
      cpus: 1
